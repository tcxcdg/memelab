<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemeLab - 表情包生成器</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f0f1f5;
      --card: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    a { text-decoration: none; color: inherit; }

    /* Header */
    header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 1.25rem 1rem; }
    header .inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; }
    header nav { display: flex; gap: 0.75rem; }
    header nav a { color: rgba(255,255,255,0.85); font-size: 0.85rem; padding: 0.35rem 0.75rem; border-radius: 20px; transition: background 0.2s; }
    header nav a:hover, header nav a.active { background: rgba(255,255,255,0.2); color: white; }

    /* Container */
    .container { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem; }

    /* Search Bar */
    .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .search-bar input { flex: 1; min-width: 200px; padding: 0.65rem 1rem; border: 1px solid var(--border); border-radius: 25px; font-size: 0.95rem; outline: none; background: var(--card); }
    .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .search-bar select { padding: 0.65rem 1rem; border: 1px solid var(--border); border-radius: 25px; font-size: 0.9rem; background: var(--card); cursor: pointer; outline: none; }

    /* Category tabs */
    .cates { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .cates .cate { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; background: var(--card); border: 1px solid var(--border); cursor: pointer; color: var(--text-light); transition: all 0.2s; }
    .cates .cate:hover { border-color: var(--primary); color: var(--primary); }
    .cates .cate.active { background: var(--primary); color: white; border-color: var(--primary); }
    .random-btn { margin-left: auto; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; background: #f59e0b; color: white; border: none; cursor: pointer; display: flex; align-items: center; gap: 0.35rem; }
    .random-btn:hover { background: #d97706; }

    /* Ad banner */
    .ad-banner { background: linear-gradient(120deg, #fee2e2, #fef3c7); border-radius: var(--radius); padding: 0.6rem 1rem; font-size: 0.8rem; color: #92400e; text-align: center; margin-bottom: 1rem; }

    /* Template Grid */
    .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.85rem; }
    .template-card { background: var(--card); border-radius: var(--radius); padding: 0.5rem; cursor: pointer; transition: transform 0.18s, box-shadow 0.18s; border: 2px solid transparent; box-shadow: var(--shadow); position: relative; }
    .template-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
    .template-card.selected { border-color: var(--primary); }
    .template-card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #f3f4f6; display: block; }
    .template-card .name { font-size: 0.75rem; color: var(--text-light); text-align: center; margin-top: 0.4rem; line-height: 1.3; }
    .template-card .badge { position: absolute; top: 0.5rem; right: 0.5rem; background: #ef4444; color: white; font-size: 0.6rem; padding: 0.15rem 0.4rem; border-radius: 10px; }
    .template-card .hot { background: #f59e0b; }
    .template-card .new { background: #10b981; }

    /* Section titles */
    .section-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .section-title span { font-size: 0.8rem; font-weight: 400; color: var(--text-light); }

    /* History bar */
    .history-bar { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .history-item { flex-shrink: 0; width: 60px; height: 60px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid var(--border); transition: border-color 0.2s; }
    .history-item:hover { border-color: var(--primary); }
    .history-item img { width: 100%; height: 100%; object-fit: cover; }
    .history-empty { color: var(--text-light); font-size: 0.8rem; display: flex; align-items: center; gap: 0.35rem; }

    /* Editor Panel */
    .editor { background: var(--card); border-radius: var(--radius); padding: 1.25rem; display: none; box-shadow: var(--shadow); }
    .editor.active { display: block; }
    .editor-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .editor-header img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; background: #f3f4f6; }
    .editor-header .info h2 { font-size: 1rem; margin-bottom: 0.25rem; }
    .editor-header .info p { font-size: 0.8rem; color: var(--text-light); }
    .editor-close { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--bg); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }

    /* Preview area */
    .preview-wrap { text-align: center; margin-bottom: 1rem; position: relative; }
    .preview-wrap img { max-width: 100%; max-height: 380px; border-radius: var(--radius); background: #f3f4f6; }
    .preview-placeholder { background: #f3f4f6; width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); color: var(--text-light); font-size: 0.9rem; flex-direction: column; gap: 0.5rem; }

    /* Fields */
    .fields { display: flex; flex-direction: column; gap: 0.75rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.2rem; }
    .field-group label { font-size: 0.78rem; color: var(--text-light); font-weight: 500; }
    .field-group input, .field-group textarea { padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.92rem; outline: none; transition: border-color 0.2s; }
    .field-group input:focus, .field-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }

    /* Buttons */
    .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    button { padding: 0.65rem 1.25rem; border: none; border-radius: 8px; font-size: 0.92rem; cursor: pointer; font-weight: 500; transition: all 0.18s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { background: #a5a5a5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
    .btn-download { background: #10b981; color: white; }
    .btn-download:hover { background: #059669; }
    .btn-share { background: #ec4899; color: white; }
    .btn-share:hover { background: #db2777; }

    /* Stats bar */
    .stats-bar { display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .stat-item { background: var(--card); border-radius: var(--radius); padding: 0.75rem 1rem; flex: 1; min-width: 120px; box-shadow: var(--shadow); text-align: center; }
    .stat-item .num { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .stat-item .label { font-size: 0.75rem; color: var(--text-light); }

    /* Footer ad */
    .footer-ad { background: var(--card); border-radius: var(--radius); padding: 1rem; text-align: center; color: var(--text-light); font-size: 0.8rem; margin-top: 1.5rem; border: 1px dashed var(--border); }

    /* Loading */
    .loading-spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .template-card { animation: fadeIn 0.3s ease; }

    /* Mobile */
    @media (max-width: 600px) {
      header .inner { flex-direction: column; gap: 0.75rem; }
      header nav { flex-wrap: wrap; justify-content: center; }
      .cates { gap: 0.35rem; }
      .cates .cate { padding: 0.3rem 0.75rem; font-size: 0.8rem; }
      .random-btn { margin-left: 0; width: 100%; justify-content: center; padding: 0.5rem; }
      .template-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.65rem; }
      .stats-bar { gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1>🎨 MemeLab</h1>
      <nav>
        <a href="#" class="active" onclick="showHome(); return false;">🏠 首页</a>
        <a href="#" onclick="showHot(); return false;">🔥 热门</a>
        <a href="#" onclick="showRandom(); return false;">🎲 随机</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-item"><div class="num" id="statTemplates">0</div><div class="label">精选模板</div></div>
      <div class="stat-item"><div class="num" id="statGenerated">0</div><div class="label">已生成图片</div></div>
      <div class="stat-item"><div class="num" id="statToday">0</div><div class="label">今日生成</div></div>
    </div>

    <!-- Ad banner -->
    <div class="ad-banner">📢 免费使用，生成即为下载 · 拒绝盗版，创意分享</div>

    <!-- History -->
    <div class="section-title">🕒 最近生成 <span id="historyCount"></span></div>
    <div class="history-bar" id="historyBar">
      <div class="history-empty">还没有生成记录</div>
    </div>

    <!-- Search + Category -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="🔍 搜索模板..." oninput="filterTemplates()">
      <select id="sortSelect" onchange="filterTemplates()">
        <option value="default">默认排序</option>
        <option value="az">A-Z 字母</option>
        <option value="hot">🔥 热门优先</option>
      </select>
    </div>
    <div class="cates" id="catesBar">
      <span class="cate active" onclick="setCate('all')">全部</span>
      <span class="cate" onclick="setCate('choice')">🤔 选择困难</span>
      <span class="cate" onclick="setCate('sarcasm')">😏 讽刺吐槽</span>
      <span class="cate" onclick="setCate('love')">❤️ 情感类</span>
      <span class="cate" onclick="setCate('daily')">😂 日常搞笑</span>
      <span class="cate" onclick="setCate('trending')">📈 时事梗</span>
      <button class="random-btn" onclick="showRandom()">🎲 随机一个</button>
    </div>

    <!-- Template Grid -->
    <div class="template-grid" id="templateGrid">
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-light)">加载中...</div>
    </div>
  </div>

  <!-- Editor Panel (overlay style) -->
  <div class="container">
    <div class="editor" id="editor">
      <div class="editor-header">
        <img id="editorThumb" src="" alt="">
        <div class="info">
          <h2 id="editorTitle">模板名称</h2>
          <p id="editorDesc">选择一个模板，输入文字后生成</p>
        </div>
        <button class="editor-close" onclick="closeEditor()">✕</button>
      </div>
      <div class="preview-wrap" id="preview">
        <div class="preview-placeholder">
          <div>👇 输入文字后点击生成</div>
        </div>
      </div>
      <div class="fields" id="fields"></div>
      <div class="btn-row">
        <button class="btn-primary" id="generateBtn" onclick="generate()">
          <span id="generateBtnText">🎨 生成图片</span>
        </button>
        <button class="btn-download" id="downloadBtn" style="display:none" onclick="downloadImage()">📥 下载</button>
        <button class="btn-share" id="shareBtn" style="display:none" onclick="shareImage()">📤 分享</button>
        <button class="btn-outline" onclick="closeEditor()">← 返回</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="footer-ad">📺 广告位（AdSense）— 支持我们免费运营</div>
  </div>

  <footer style="text-align:center;padding:2rem 1rem;font-size:0.78rem;color:var(--text-light);background:var(--bg)">
    MemeLab © 2026 · 免费表情包生成器 · 请勿用于盗版用途
  </footer>

  <script>
    // ─── Data ───────────────────────────────────────────────
    const CHINESE_MEMES = [
      { id: 181913649, name: "Drake Hotline Bling", tags: ["choice", "sarcasm"], hot: true, alias: "德雷克" },
      { id: 87798620, name: "Two Buttons", tags: ["choice", "daily"], hot: true, alias: "两个按钮" },
      { id: 359341392, name: "Distracted Boyfriend", tags: ["love", "sarcasm"], hot: true, alias: "三选一" },
      { id: 217743513, name: "UNO Draw 25 Cards", tags: ["daily", "sarcasm"], hot: true, alias: "反叛卡片" },
      { id: 124822590, name: "Bernie I Am Once Again Asking", tags: ["sarcasm", "trending"], hot: true, alias: "再次请求" },
      { id: 119139145, name: "Left Exit 12 Off Ramp", tags: ["choice", "daily"], hot: false, alias: "突然转向" },
      { id: 55311130, name: " Gru's Plan", tags: ["sarcasm", "trending"], hot: true, new: true, alias: "格鲁计划" },
      { id: 282517965, name: "Waiting Skeleton", tags: ["daily", "trending"], hot: false, new: true, alias: "等很久" },
      { id: 4086413, name: "Disaster Girl", tags: ["daily"], hot: false, alias: "灾难女" },
      { id: 135256804, name: "Success Kid", tags: ["daily"], hot: false, alias: "成功小孩" },
      { id: 61579, name: "One Does Not Simply", tags: ["sarcasm"], hot: false, alias: "事情没那么简单" },
      { id: 3218037, name: "Futurama Fry", tags: ["sarcasm"], hot: false, alias: "弗莱切双关" },
      { id: 40565839, name: "Leonardo DiCaprio Cheers", tags: ["choice", "daily"], hot: true, new: true, alias: "小李举杯" },
      { id: 7156131319388799211, name: "I'm a Lawyer And", tags: ["sarcasm", "trending"], hot: true, alias: "我是律师" },
      { id: 155233146, name: "Bernie Sanders Once Again", tags: ["sarcasm", "trending"], hot: true, alias: "桑神又来了" },
      { id: 2165233526, name: "Trade Offer", tags: ["choice", "daily"], hot: true, alias: "交易offer" },
      { id: 293482636646178816, name: "Is This A Pigeon", tags: ["choice", "sarcasm"], hot: true, alias: "这是鸽子吗" },
      { id: 294822567, name: "Panik K-Panik", tags: ["daily", "sarcasm"], hot: false, alias: "慌张家族" },
      { id: 286098447, name: "Hide the Pain Harold", tags: ["daily"], hot: false, alias: "痛苦哈罗德" },
      { id: 247375703, name: "This Is Fine", tags: ["daily", "trending"], hot: true, alias: "没关系" },
    ];

    // ─── State ──────────────────────────────────────────────
    let allMemes = [];
    let selectedMeme = null;
    let generatedUrl = null;
    let history = JSON.parse(localStorage.getItem('memelab_history') || '[]');
    let statGenerated = parseInt(localStorage.getItem('memelab_total') || '0');
    let statTodayKey = new Date().toISOString().slice(0,10);
    let statToday = parseInt(localStorage.getItem('memelab_today') || '0');

    // ─── Init ──────────────────────────────────────────────
    async function init() {
      updateStats();
      renderHistory();
      await loadMemes();
    }

    // ─── Load from Imgflip ─────────────────────────────────
    async function loadMemes() {
      try {
        const res = await fetch('https://api.imgflip.com/get_memes');
        const data = await res.json();
        const apiMemes = data.data.memes.slice(0, 60);
        allMemes = apiMemes.map(m => ({
          id: m.id,
          name: m.name,
          url: m.url,
          box_count: m.box_count,
          tags: inferTags(m.name),
          hot: Math.random() > 0.6,
          new: Math.random() > 0.8
        }));
        // Merge local Chinese meme metadata
        CHINESE_MEMES.forEach(cm => {
          const idx = allMemes.findIndex(m => m.id == cm.id);
          if (idx >= 0) {
            allMemes[idx].tags = cm.tags;
            allMemes[idx].hot = cm.hot;
            allMemes[idx].new = cm.new;
            allMemes[idx].alias = cm.alias;
          }
        });
        renderTemplates(allMemes);
      } catch {
        document.getElementById('templateGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#ef4444">加载失败，请刷新重试</div>';
      }
    }

    function inferTags(name) {
      const n = name.toLowerCase();
      if (n.includes('girl') || n.includes('boy') || n.includes('love') || n.includes('relationship')) return ['love'];
      if (n.includes('choice') || n.includes('button') || n.includes('pick')) return ['choice'];
      if (n.includes('sad') || n.includes('cry') || n.includes('pain') || n.includes('bernie')) return ['sarcasm'];
      return ['daily'];
    }

    // ─── Render Templates ─────────────────────────────────
    function renderTemplates(list) {
      const grid = document.getElementById('templateGrid');
      if (!list.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-light)">没有找到匹配的模板</div>';
        return;
      }
      grid.innerHTML = list.map(m => {
        let badges = '';
        if (m.hot) badges += '<span class="badge hot">🔥</span>';
        if (m.new) badges += '<span class="badge new">NEW</span>';
        return `
          <div class="template-card" onclick="selectMeme('${m.id}')">
            ${badges}
            <img src="${m.url}" alt="${m.name}" loading="lazy">
            <div class="name">${m.name.substring(0, 25)}</div>
          </div>
        `;
      }).join('');
    }

    // ─── Filter & Category ─────────────────────────────────
    let currentCate = 'all';
    function setCate(cate) {
      currentCate = cate;
      document.querySelectorAll('.cates .cate').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      filterTemplates();
    }

    function filterTemplates() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;
      let list = allMemes.filter(m => {
        const matchCate = currentCate === 'all' || (m.tags && m.tags.includes(currentCate));
        const matchSearch = !q || m.name.toLowerCase().includes(q) || (m.alias && m.alias.includes(q));
        return matchCate && matchSearch;
      });
      if (sort === 'az') list.sort((a,b) => a.name.localeCompare(b.name));
      if (sort === 'hot') list.sort((a,b) => (b.hot?1:0) - (a.hot?1:0));
      renderTemplates(list);
    }

    // ─── Select Meme ──────────────────────────────────────
    function selectMeme(id) {
      selectedMeme = allMemes.find(m => m.id == id);
      if (!selectedMeme) return;
      document.getElementById('editorThumb').src = selectedMeme.url;
      document.getElementById('editorTitle').textContent = selectedMeme.alias || selectedMeme.name;
      document.getElementById('editorDesc').textContent = selectedMeme.name;

      const fields = document.getElementById('fields');
      fields.innerHTML = '';
      for (let i = 0; i < selectedMeme.box_count; i++) {
        fields.innerHTML += `
          <div class="field-group">
            <label>文字 ${i+1}</label>
            <input type="text" id="text${i}" placeholder="输入文字..." maxlength="100">
          </div>
        `;
      }
      document.getElementById('preview').innerHTML = `<img src="${selectedMeme.url}" alt="template">`;
      document.getElementById('downloadBtn').style.display = 'none';
      document.getElementById('shareBtn').style.display = 'none';
      document.getElementById('generateBtn').style.display = '';
      document.getElementById('generateBtnText').textContent = '🎨 生成图片';

      document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
    }

    // ─── Generate ─────────────────────────────────────────
    async function generate() {
      if (!selectedMeme) return;
      const btn = document.getElementById('generateBtn');
      const btnText = document.getElementById('generateBtnText');
      btn.disabled = true;
      btnText.innerHTML = '<span class="loading-spinner"></span> 生成中...';

      const texts = [];
      for (let i = 0; i < selectedMeme.box_count; i++) {
        texts.push(document.getElementById('text' + i).value || '');
      }

      try {
        const params = new URLSearchParams({
          template_id: selectedMeme.id,
          username: 'MEMELAB_USER',
          password: 'MEMELAB_PASS',
          text0: texts[0] || '',
          text1: texts[1] || '',
          text2: texts[2] || '',
          text3: texts[3] || '',
          text4: texts[4] || '',
        });
        const res = await fetch('https://api.imgflip.com/caption_image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });
        const data = await res.json();
        if (data.success) {
          generatedUrl = data.data.url;
          document.getElementById('preview').innerHTML = `<img src="${generatedUrl}" alt="generated">`;
          btn.style.display = 'none';
          document.getElementById('downloadBtn').style.display = '';
          document.getElementById('shareBtn').style.display = '';
          addToHistory(generatedUrl);
          statGenerated++;
          statToday++;
          localStorage.setItem('memelab_total', statGenerated);
          localStorage.setItem('memelab_today', statToday);
          updateStats();
        } else {
          alert('⚠️ ' + (data.error_message || '生成失败'));
        }
      } catch {
        alert('❌ 网络错误，请重试');
      }
      btn.disabled = false;
      btnText.textContent = '🎨 生成图片';
    }

    // ─── History ──────────────────────────────────────────
    function addToHistory(url) {
      history.unshift(url);
      if (history.length > 20) history = history.slice(0, 20);
      localStorage.setItem('memelab_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const bar = document.getElementById('historyBar');
      if (!history.length) {
        bar.innerHTML = '<div class="history-empty">还没有生成记录</div>';
        document.getElementById('historyCount').textContent = '';
        return;
      }
      document.getElementById('historyCount').textContent = `(${history.length}张)`;
      bar.innerHTML = history.map(url => `
        <div class="history-item" onclick="restoreHistory('${url}')">
          <img src="${url}" alt="history">
        </div>
      `).join('');
    }

    function restoreHistory(url) {
      document.getElementById('preview').innerHTML = `<img src="${url}" alt="generated">`;
      generatedUrl = url;
      document.getElementById('generateBtn').style.display = 'none';
      document.getElementById('downloadBtn').style.display = '';
      document.getElementById('shareBtn').style.display = '';
      document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
    }

    // ─── Download ─────────────────────────────────────────
    function downloadImage() {
      if (!generatedUrl) return;
      const a = document.createElement('a');
      a.href = generatedUrl;
      a.download = 'memelab.jpg';
      a.target = '_blank';
      a.click();
    }

    // ─── Share ────────────────────────────────────────────
    function shareImage() {
      if (!generatedUrl) return;
      if (navigator.share) {
        navigator.share({ title: 'MemeLab', text: '用 MemeLab 生成的表情包', url: generatedUrl }).catch(() => {});
      } else {
        // Fallback: copy URL
        navigator.clipboard.writeText(generatedUrl).then(() => alert('📋 图片链接已复制到剪贴板'));
      }
    }

    // ─── Stats ────────────────────────────────────────────
    function updateStats() {
      document.getElementById('statTemplates').textContent = CHINESE_MEMES.length + '+';
      document.getElementById('statGenerated').textContent = statGenerated;
      document.getElementById('statToday').textContent = statToday;
    }

    // ─── Nav actions ───────────────────────────────────────
    function showHome() {
      currentCate = 'all';
      document.getElementById('searchInput').value = '';
      document.getElementById('sortSelect').value = 'default';
      filterTemplates();
    }

    function showHot() {
      currentCate = 'all';
      document.getElementById('sortSelect').value = 'hot';
      filterTemplates();
    }

    function showRandom() {
      if (!allMemes.length) return;
      const rand = allMemes[Math.floor(Math.random() * allMemes.length)];
      selectMeme(rand.id);
    }

    function closeEditor() {
      document.getElementById('editor').classList.remove('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    init();
  </script>
</body>
</html>
